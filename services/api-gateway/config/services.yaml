services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    PhpCommon\Security\JwtService:
        arguments:
            $secret: '%env(JWT_SECRET)%'

    redis.connection:
        class: Redis
        calls:
            - [connect, ['%env(REDIS_HOST)%', 6379]]

    PhpCommon\Security\TokenBlacklistService:
        arguments:
            $redis: '@redis.connection'

    PhpCommon\RateLimit\RateLimiterService:
        arguments:
            $redis: '@redis.connection'

    App\EventSubscriber\JwtAuthSubscriber:
        arguments:
            $jwtService: '@PhpCommon\Security\JwtService'
            $blacklistService: '@PhpCommon\Security\TokenBlacklistService'
        tags:
            - { name: kernel.event_subscriber }

    App\Service\ProxyService:
        arguments:
            $routeMap:
                '/user':        'http://user-service'
                '/account':     'http://account-service'
                '/transaction': 'http://transaction-service'
                '/ledger':      'http://ledger-service'
