
# ── Rate limit zones (defined outside server block) ──────────────────────────
#
# Zone: api_general  — 60 req/min per IP for all API traffic
# Zone: api_auth     — 10 req/min per IP for login/register (brute-force protection)
#
# $binary_remote_addr uses 4 bytes (IPv4) vs 7 bytes ($remote_addr), saving memory.
# 10m = 10 MB shared memory, holds ~160k IP states.

limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;

# Return JSON 429 instead of default HTML
limit_req_status 429;

server {
    listen 80;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── CORS headers for all responses ───────────────────────────────────
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    # Handle preflight OPTIONS requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Auth endpoints — strict limit (brute-force protection) ───────────
    location = /user/login {
        limit_req zone=api_auth burst=5 nodelay;
        include fastcgi_params;
        fastcgi_pass user-service:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    location = /user/register {
        limit_req zone=api_auth burst=5 nodelay;
        include fastcgi_params;
        fastcgi_pass user-service:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # ── User Service (/user/*) ────────────────────────────────────────────
    location ~ ^/user(/.*)?$ {
        limit_req zone=api_general burst=20 nodelay;
        include fastcgi_params;
        fastcgi_pass user-service:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # ── Account Service (/account/*) ─────────────────────────────────────
    location ~ ^/account(/.*)?$ {
        limit_req zone=api_general burst=20 nodelay;
        include fastcgi_params;
        fastcgi_pass account-service:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # ── Transaction Service (/transaction/*) ──────────────────────────────
    location ~ ^/transaction(/.*)?$ {
        limit_req zone=api_general burst=20 nodelay;
        include fastcgi_params;
        fastcgi_pass transaction-service:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # ── Ledger Service (/ledger/*) ────────────────────────────────────────
    location ~ ^/ledger(/.*)?$ {
        limit_req zone=api_general burst=20 nodelay;
        include fastcgi_params;
        fastcgi_pass ledger-service:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # ── API Gateway (/api/*) ──────────────────────────────────────────────
    location ~ ^/api(/.*)?$ {
        limit_req zone=api_general burst=20 nodelay;
        include fastcgi_params;
        fastcgi_pass api-gateway:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # ── Nginx health (no rate limit) ──────────────────────────────────────
    location = /health {
        return 200 'nginx ok';
        add_header Content-Type text/plain;
    }

    # ── Custom 429 JSON response ──────────────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too many requests. Please slow down.","code":429}';
    }
}
